<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>HELLO FORMS</h1>
    <form action="" method="dialog">
        <label for="first-name">First Name:</label>
        <br />
        <input type="text" id="first-name" name="first-name" placeholder="Enter Your First Name">
        <br />
        <label for="last-name">Last Name:</label>
        <br />
        <input type="text" name="last-name" id="last-name" placeholder="Enter Last Name">
        <br />
        <label for="number">Tell No:</label>
        <br />
        <input type="number" name="number" id="number" placeholder="Enter Your Number">
        <br />
        <label for="email">Email</label>
        <br />
        <input type="email" name="email" id="email" placeholder="Enter Your Email">

        <br />

        <label for="Gender">Gender</label>
        <br />
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender">
        <label for="female">female</label>
        <br />
        <label for="hobbies">Hobbies:</label>
        <br />
        <label for="cricket">Cricket</label>
        <input type="checkbox" name="cricket" id="cricket">
        <label for="hockey">Hockey</label>
        <input type="checkbox" name="hockey" id="hockey">
        <label for="badminton">Badminton</label>
        <input type="checkbox" name="badminton" id="badminton">
        <br />
        <label for="province">Province</label>
        <select name="province" id="province">
            <option value="sindh">Sindh</option>
            <option value="balochistan">Balochistan</option>
            <option value="KPK">KPK</option>
        </select>
        <br />
        <br />
        <button><b>SUBMIT</b></button>

    </form>

</body>

</html>
